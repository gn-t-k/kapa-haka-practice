<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ハカ練習</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header class="top"><h1>ハカ練習</h1></header>
    <p class="note">練習する曲を選んでください。</p>
    <ul class="song-list" id="songs"><li>読み込み中…</li></ul>
  </div>
  <script>
    fetch('songs/index.json', { cache: 'no-cache' })
      .then(r => r.json())
      .then(songs => {
        const ul = document.getElementById('songs');
        ul.textContent = '';
        for (const s of songs) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = 'player.html#' + encodeURIComponent(s.id);
          a.textContent = s.title;
          li.appendChild(a);
          ul.appendChild(li);
        }
      })
      .catch(() => {
        document.getElementById('songs').textContent = '曲一覧を読み込めませんでした。';
      });
  </script>
</body>
</html>
